import org.slf4j.event.Level

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge-${neo_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory.set(layout.projectDirectory.dir('run-data'))
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

repositories {
    mavenCentral()

    maven {
        // JEI, Quark, Zeta
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroupAndSubgroups 'com.blamejared'
            includeGroupAndSubgroups 'org.violetmoon'
            includeGroup 'org.openzen.zencode'
            includeGroup 'com.faux.ingredientextension'
            includeGroup 'com.faux.customentitydata'
        }
    }
}

dependencies {
    // JEI -- optional, recipe categories for every Rustic machine.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Quark -- optional, chest buttons and drop-off support on Rustic storage.
    compileOnly("org.violetmoon.quark:Quark:${quark_version}") { transitive = false }
    compileOnly("org.violetmoon.zeta:Zeta:${zeta_version}") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            issue_tracker          : issue_tracker,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Writes the compile classpath to build/compile-classpath.txt (used for quick javac checks).
tasks.register('writeCompileClasspath') {
    dependsOn 'createMinecraftArtifacts'
    doLast {
        def out = layout.buildDirectory.file('compile-classpath.txt').get().asFile
        out.parentFile.mkdirs()
        out.text = sourceSets.main.compileClasspath.asPath
    }
}
